<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Secure Dynamic Task Manager</h1>
        <p class="subtitle">Manage your tasks dynamically and securely.</p>

        <div class="controls">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button id="addTaskBtn">Add Task</button>

            <button id="loadSamplesBtn">
                Load Sample Tasks
            </button>
        </div>

        <p id="taskMessage"></p>

        <div class="summary">

            <div class="box">
                <span>Total Tasks</span>
                <strong id="totalCount">0</strong>
            </div>

            <div class="box">
                <span>Pending</span>
                <strong id="pendingCount">0</strong>
            </div>

            <div class="box">
                <span>Completed</span>
                <strong id="completedCount">0</strong>
            </div>

        </div>

        <h2>My Tasks</h2>

        <ul id="taskList"></ul>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
